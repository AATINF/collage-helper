name: Build Android APK

# 只在手动触发或打 v* tag 时构建，避免每次 push 都烧构建时间
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # 必须：上传 Release 时需要，否则 403

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: python3 tools/prepare_www.py

      - name: Capacitor sync
        run: npx cap sync android

      # 关键验证：确认打进 APK 的确实是这次提交的版本，不是缓存里的旧货
      - name: Verify web assets
        run: |
          echo "== 打进 APK 的版本号 =="
          grep -o 'id="appVer">[^<]*' www/index.html || true
          echo "== 关键模块是否在包里 =="
          for f in src/app.js src/core/compose.js src/io/bridge.js; do
            printf '%-24s %s\n' "$f" "$(test -f www/$f && echo OK || echo MISSING)"
          done
          echo "== assets/public 内容 =="
          ls -1 android/app/src/main/assets/public/

      - name: Restore signing key
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/sign/release.p12"
          ls -l "$RUNNER_TEMP/sign/release.p12"

      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/sign/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          VER=$(node -p "require('./package.json').version")
          find android -name "*.apk" -path "*release*" | head
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/collage-helper-v${VER}.apk"
          # 固定文件名的副本，保证 /releases/latest/download/collage-helper.apk 长期有效
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/collage-helper.apk"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collage-helper-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          overwrite_files: true
