name: Keystore once

# ⚠️ 一次性用途：在云端生成签名密钥并作为 artifact 交回，生成后立刻删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.p12 -storetype PKCS12 \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=AATINF, O=AATINF, C=CN"
          base64 -w0 release.p12 > keystore.b64
          echo "b64 长度: $(wc -c < keystore.b64)"
          keytool -list -keystore release.p12 -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
          retention-days: 1
